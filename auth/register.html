<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Jogo da Forca</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-b from-indigo-50 to-white text-slate-800">
    <main class="flex min-h-screen items-center justify-center p-6">
        <section class="w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-600">Jogo da Forca</h1>
                <p class="text-sm text-slate-500 mt-1">Crie sua conta</p>
            </div>

            <form class="bg-white rounded-xl shadow p-6 space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700">Nome</label>
                    <input id="name" name="name" type="text" required minlength="2"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Seu nome">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
                    <input id="email" name="email" type="email" required
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="seu@email.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Senha</label>
                    <input id="password" name="password" type="password" required
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="••••••••">
                </div>

                <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 text-white py-2.5 font-medium hover:bg-indigo-700 transition">Cadastrar</button>
            </form>

            <p class="text-center text-sm text-slate-600 mt-4">
                Já tem conta?
                <a href="./login.html" class="text-indigo-600 hover:underline">Entrar</a>
            </p>
        </section>
    </main>
</body>

</html>

<header class="border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="mx-auto max-w-5xl px-6 py-4 flex items-center justify-between">
        <a href="#" data-route="/main" class="text-sm text-slate-600 hover:text-indigo-600">← Voltar</a>
        <h1 class="text-xl font-bold text-indigo-600">Jogo da Forca</h1>

<main class="mx-auto max-w-5xl px-6 py-10">

        <div class="flex flex-col items-center gap-6">
            <p class="text-slate-500 text-sm">Área do jogo (placeholder)</p>
            <div class="w-full grid gap-4 md:grid-cols-3">

                <div class="rounded-lg border border-dashed border-slate-300 p-6 text-center">Palavra: _ _ _ _ _</div>

            </div>

            <div class="flex items-center gap-3">
                <button
                    class="rounded-lg bg-indigo-600 text-white px-4 py-2 font-medium hover:bg-indigo-700 transition">Nova
                    palavra</button>
                <button
                    class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-slate-700 hover:bg-slate-50 transition">Desistir</button>
            </div>
        </div>

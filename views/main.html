<header class="border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="mx-auto max-w-5xl px-6 py-4 flex items-center justify-between">
        <h1 class="text-xl font-bold text-indigo-600">Jogo da Forca</h1>
        <nav class="text-sm text-slate-600">
            <a href="#" data-route="/login" class="hover:text-indigo-600">Sair</a>
        </nav>
    </div>
</header>

<main class="mx-auto max-w-5xl px-6 py-10">
    <section class="grid gap-6 md:grid-cols-2">
        <div class="rounded-2xl bg-white shadow p-6">
            <h2 class="text-lg font-semibold text-slate-800">Jogar</h2>
            <p class="text-sm text-slate-600 mt-1">Comece uma nova partida agora.</p>
            <a href="#" data-route="/play"
                class="mt-4 inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2 text-white font-medium hover:bg-indigo-700 transition">Iniciar
                jogo</a>
        </div>

        <div class="rounded-2xl bg-white shadow p-6">
            <h2 class="text-lg font-semibold text-slate-800">Configurações</h2>
            <p class="text-sm text-slate-600 mt-1">Ajuste opções da partida.</p>

            <form class="mt-4 grid gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700" for="dificuldade">Dificuldade</label>
                    <select id="dificuldade"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="facil">Fácil</option>
                        <option value="medio">Médio</option>
                        <option value="dificil">Difícil</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700" for="tema">Tema de palavras</label>
                    <select id="tema"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="geral">Geral</option>
                        <option value="animais">Animais</option>
                        <option value="tecnologia">Tecnologia</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <input id="dicas" type="checkbox"
                        class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="dicas" class="text-sm text-slate-700">Habilitar dicas</label>
                </div>

                <button type="button"
                    class="justify-self-start rounded-lg border border-slate-300 bg-white px-4 py-2 text-slate-700 hover:bg-slate-50 transition">Salvar</button>
            </form>
        </div>
    </section>
</main>
